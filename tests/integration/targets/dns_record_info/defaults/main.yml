---
vultr_dns_domain_name: "{{ vultr_resource_prefix }}-t4-vultr.com"

vultr_dns_record_info_items:
  # Two A records sharing a name (round robin)
  - name: test-www
    data: 10.10.10.10
    record_type: A
    multiple: true
  - name: test-www
    data: 10.10.10.11
    record_type: A
    multiple: true

  - name: test-www-v6
    data: "2001:db8::10"
    record_type: AAAA

  - name: test-cname
    data: www.example-ansible.com
    record_type: CNAME
