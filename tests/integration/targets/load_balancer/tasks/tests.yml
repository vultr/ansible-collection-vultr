---
- name: test create load balancer in check mode
  vultr.cloud.load_balancer: &create
    label: "{{ load_balancer_defaults.label }}"
    region: "{{ load_balancer_defaults.region }}"
    balancing_algorithm: "{{ load_balancer_defaults.balancing_algorithm }}"
    ssl_redirect: "{{ load_balancer_defaults.ssl_redirect }}"
    http2: "{{ load_balancer_defaults.http2 }}"
    http3: "{{ load_balancer_defaults.http3 }}"
    proxy_protocol: "{{ load_balancer_defaults.proxy_protocol }}"
    timeout: "{{ load_balancer_defaults.timeout }}"
    nodes: "{{ load_balancer_defaults.nodes }}"
    health_check: "{{ load_balancer_defaults.health_check }}"
    forwarding_rules: "{{ load_balancer_defaults.forwarding_rules }}"
    firewall_rules: "{{ load_balancer_defaults.firewall_rules }}"
  register: result
  check_mode: true
- name: verify test create load balancer in check mode
  ansible.builtin.assert:
    that:
      - result is changed

- name: test create load balancer
  vultr.cloud.load_balancer: *create
  register: result
- name: verify test create load balancer
  ansible.builtin.assert:
    that:
      - result is changed
      - result.vultr_load_balancer.label == load_balancer_defaults.label
      - result.vultr_load_balancer.region == load_balancer_defaults.region

- name: test create load balancer idempotence
  vultr.cloud.load_balancer: *create
  register: result
- name: verify test create load balancer idempotence
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.vultr_load_balancer.label == load_balancer_defaults.label
      - result.vultr_load_balancer.proxy_protocol == load_balancer_defaults.proxy_protocol
      - result.vultr_load_balancer.timeout == load_balancer_defaults.timeout

- name: test update load balancer in check mode
  vultr.cloud.load_balancer: &update
    label: "{{ load_balancer_defaults.label }}"
    region: "{{ load_balancer_defaults.region }}"
    proxy_protocol: true
    forwarding_rules:
      - frontend_protocol: http
        frontend_port: 80
        backend_protocol: http
        backend_port: 8080
      - frontend_protocol: http
        frontend_port: 443
        backend_protocol: http
        backend_port: 8443
    # Drop one firewall rule to test that a removal counts as a change.
    firewall_rules: "{{ load_balancer_defaults.firewall_rules[:1] }}"
  register: result
  check_mode: true
- name: verify test update load balancer in check mode
  ansible.builtin.assert:
    that:
      - result is changed

- name: test update load balancer
  vultr.cloud.load_balancer: *update
  register: result
  until: result is not failed
  retries: 6
  delay: 30
- name: verify test update load balancer
  ansible.builtin.assert:
    that:
      - result is changed
      - result.vultr_load_balancer.label == load_balancer_defaults.label
      - result.vultr_load_balancer.forwarding_rules | length == 2
      - result.vultr_load_balancer.firewall_rules | length == 1

- name: test update load balancer idempotence
  vultr.cloud.load_balancer: *update
  register: result
- name: verify test update load balancer idempotence
  ansible.builtin.assert:
    that:
      - result is not changed
      - result.vultr_load_balancer.proxy_protocol is true

- name: test absent load balancer in check mode
  vultr.cloud.load_balancer: &absent
    label: "{{ load_balancer_defaults.label }}"
    region: "{{ load_balancer_defaults.region }}"
    state: absent
  register: result
  check_mode: true
- name: verify test absent load balancer in check mode
  ansible.builtin.assert:
    that:
      - result is changed

- name: test absent load balancer
  vultr.cloud.load_balancer: *absent
  register: result
  until: result is not failed
  retries: 6
  delay: 30
- name: verify test absent load balancer
  ansible.builtin.assert:
    that:
      - result is changed

- name: test absent load balancer idempotence
  vultr.cloud.load_balancer: *absent
  register: result
- name: verify test absent load balancer idempotence
  ansible.builtin.assert:
    that:
      - result is not changed
